# CouchDB 单节点配置，值与上游 Self-hosted LiveSync 文档要求一致
# （https://github.com/vrtmrz/obsidian-livesync/blob/main/docs/setup_own_server.md，
#   https://github.com/vrtmrz/self-hosted-livesync-server 的 conf/local.ini）。
[couchdb]
single_node = true
max_document_size = 50000000
uuid = d46ef0c021f74c152c550f43511e766c

[chttpd]
require_valid_user = true
max_http_request_size = 4294967296

[chttpd_auth]
require_valid_user = true

[httpd]
WWW-Authenticate = Basic realm="couchdb"
enable_cors = true

[cors]
origins = app://obsidian.md,capacitor://localhost,http://localhost
credentials = true
headers = accept, authorization, content-type, origin, referer
methods = GET, PUT, POST, HEAD, DELETE
max_age = 3600

[admins]
admin = -pbkdf2:sha256-0737746db3a8398481cd88625cec1cf03b835d6fb39408396eb988247516f505,209fb694aa39d8a4617e9030cb5d7fca,600000
