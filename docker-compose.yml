# Obsidian LiveSync 同步后端：CouchDB 单节点。电脑版 Obsidian 装社区插件 Self-hosted LiveSync，
# 经局域网端口连到这里，多台电脑的笔记实时同步，数据都在自己家里。
# 手机端要 HTTPS 才能连（上游文档明确要求），当前底座没有局域网 HTTPS 入口，见 README 已知限制。
services:
  couchdb:
    # 上游官方镜像，按清单列表（index）的摘要固定；amd64 和 arm64 都有。
    image: couchdb:3.5.3@sha256:907eab5b7e55ab7cfd241d39b90b2a335ea40bef82acee5a37388c08bf201dda
    # 不写 user：镜像入口脚本以 root 修 /opt/couchdb 属主、写入 docker.ini 后再降回 5984（上游镜像约定），
    # 数据目录随之归 5984:5984（上游 setup_own_server.md 也这么提示）。
    environment:
      # 管理员账号由镜像入口脚本写进 local.d/docker.ini；密码是核心生成的密钥。
      COUCHDB_USER: admin
      COUCHDB_PASSWORD: ${WONTON_SECRET_ADMIN_PASSWORD}
    volumes:
      - ${WONTON_APP_DATA}/data:/opt/couchdb/data
    # LiveSync 要求的服务端配置（单节点、登录必填、CORS、大小上限），值与上游文档一致。
    configs:
      - source: livesync-config
        target: /opt/couchdb/etc/local.d/obsidian.ini
    healthcheck:
      # 镜像里没有 curl/wget：用 bash 的 /dev/tcp 请求 /_up。
      # require_valid_user=true 时 /_up 也要登录，带管理员凭据（实测 401→带凭据 200）。
      test:
        - CMD-SHELL
        - >-
          bash -c 'exec 3<>/dev/tcp/127.0.0.1/5984 && printf "GET /_up HTTP/1.0\r\nHost: localhost\r\nAuthorization: Basic %s\r\n\r\n" "$$(printf "%s:%s" "$$COUCHDB_USER" "$$COUCHDB_PASSWORD" | base64 -w 0)" >&3 && head -1 <&3 | grep -q " 200 "'
      interval: 30s
      timeout: 5s
      start_period: 30s
      start_interval: 1s

  # 一次性服务：等 CouchDB 健康后建库、建客户端账号、设库权限，并核验 CORS 与账号真的可用；失败即停。
  # 每次创建容器都会重跑，全部动作幂等。
  init:
    image: curlimages/curl:8.18.0@sha256:d94d07ba9e7d6de898b6d96c1a072f6f8266c687af78a74f380087a0addf5d17
    entrypoint: ["/bin/sh", "/init.sh"]
    environment:
      COUCHDB_USER: admin
      WONTON_SECRET_ADMIN_PASSWORD: ${WONTON_SECRET_ADMIN_PASSWORD}
      WONTON_OWNER_NAME: ${WONTON_OWNER_NAME:?核心没有注入用户名}
      WONTON_SECRET_CLIENT_PASSWORD: ${WONTON_SECRET_CLIENT_PASSWORD}
    configs:
      - source: init-script
        target: /init.sh
    depends_on:
      couchdb:
        condition: service_healthy
    restart: "no"

configs:
  livesync-config:
    file: couchdb.ini
  init-script:
    file: init.sh

x-wonton:
  spec: "0.11"
  id: io.github.vrtmrz.obsidian-livesync
  version: 0.1.0
  kind: app
  title: { zh: 笔记同步（Obsidian LiveSync）, en: Note Sync (Obsidian LiveSync) }
  description:
    zh: 像 Obsidian 官方的同步服务，让家里几台电脑上的笔记实时保持一致，数据存在自己家里，不用付订阅费。手机要 HTTPS 才能连，暂时不支持手机。
    en: Like the official Obsidian Sync, keeping notes on your computers in sync through your own server at home, no subscription. Phones need HTTPS and are not supported yet.
  icon: icon.svg
  notices: [NOTICE]
  author: { name: geraldpeng6 }
  homepage: https://github.com/vrtmrz/obsidian-livesync
  # 服务端是 Apache CouchDB（Apache-2.0）；客户端插件 Self-hosted LiveSync 是 MIT，见 README。
  license: Apache-2.0
  tags:
    zh: [笔记, 同步]
    en: [Notes, Sync]
  about:
    zh: |
      Obsidian 装上社区插件 Self-hosted LiveSync 后，几台电脑的笔记实时同步，数据保存在自己家里。

      在插件详情里打开“在局域网开放”，把显示的地址、账号、密码填进 LiveSync 的连接设置，数据库名填 obsidiandb。

      已知限制：手机上的 Obsidian 要求 HTTPS 连接（上游文档写明），家里的服务器还没有局域网 HTTPS 入口，手机暂时连不上；先在电脑之间用。
    en: |
      Install the Self-hosted LiveSync community plugin in Obsidian, and notes on several computers stay in sync in real time, stored at home.

      Turn on the LAN switch in the plugin details, then enter the address, account and password shown there into LiveSync; database name is obsidiandb.

      Known limitation: Obsidian on phones requires HTTPS (stated in the upstream docs) and there is no LAN HTTPS entry yet, so phones cannot connect for now; use it between computers first.
  release_notes: { zh: 首个版本。, en: First release. }
  setup:
    zh: 在电脑版 Obsidian 安装社区插件 Self-hosted LiveSync，打开本插件的“在局域网开放”，把显示的地址、账号、密码填进 LiveSync 的连接设置，数据库名填 obsidiandb。
    en: Install the Self-hosted LiveSync community plugin in Obsidian, turn on the LAN switch in this plugin's details, and enter the address, account and password shown there; the database name is obsidiandb.
  # Obsidian 从局域网直连 CouchDB：地址、账号在详情页显示，密码由核心生成。
  lan:
    ports:
      - { service: couchdb, port: 5984 }
    client:
      address: "http://{host}:5984"
      username: "{user}"
      password: "{secret:client_password}"
  secrets:
    admin_password:
      generate: { bytes: 32 }
    client_password:
      generate: { bytes: 32 }
  permissions:
    - network.lan
    # 知道用户名：客户端账号按注入的用户名建。
    - owner.identity
  # 空闲实测约 160M（docker stats）；镜像支持 amd64 和 arm64（docker buildx imagetools inspect）。
  requirements:
    arch: [amd64, arm64]
    memory: 256M
